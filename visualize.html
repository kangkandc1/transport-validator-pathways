<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Pathway Issues Visualizer</title>
    <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
        #header { background: #2c3e50; color: white; padding: 10px 20px; display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
        #header h1 { font-size: 18px; white-space: nowrap; }
        #station-select { padding: 6px 10px; font-size: 14px; border-radius: 4px; border: none; min-width: 250px; }
        #main { display: flex; flex: 1; overflow: hidden; }
        #issues-panel { width: 350px; flex-shrink: 0; background: #f5f6fa; border-right: 1px solid #dcdde1; display: flex; flex-direction: column; overflow: hidden; }
        #issues-panel h2 { padding: 15px; font-size: 16px; background: #ecf0f1; border-bottom: 1px solid #dcdde1; }
        #issues-list { flex: 1; overflow-y: auto; padding: 10px; }
        .issue-card { background: white; border: 1px solid #dcdde1; border-radius: 6px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
        .issue-card:hover { border-color: #3498db; box-shadow: 0 2px 8px rgba(52,152,219,0.15); }
        .issue-card.active { border-color: #e74c3c; background: #fdf0ef; box-shadow: 0 0 0 2px rgba(231,76,60,0.3); }
        .issue-type { font-weight: 700; font-size: 14px; margin-bottom: 6px; color: #2c3e50; }
        .issue-pathway { font-size: 12px; color: #7f8c8d; margin-bottom: 4px; }
        .issue-stops { font-size: 12px; color: #7f8c8d; }
        .issue-stops span { display: inline-block; background: #ecf0f1; padding: 2px 6px; border-radius: 3px; margin: 1px; font-family: monospace; font-size: 11px; }
        .no-issues { color: #95a5a6; text-align: center; padding: 20px; font-style: italic; }
        #map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        #map .maplibregl-popup { max-width: 300px !important; }
        #map .maplibregl-popup-content { font-size: 12px; line-height: 1.4; }
        .custom-legend { position: absolute; bottom: 30px; right: 10px; z-index: 1000; background: white; padding: 10px; border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,0.2); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .legend-item { display: flex; align-items: center; gap: 6px; margin: 4px 0; font-size: 12px; }
        .legend-color { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #333; }
        .error-banner { background: #e74c3c; color: white; padding: 12px 20px; text-align: center; flex-shrink: 0; }
    </style>
</head>
<body>
    <div id="header">
        <h1>🚇 Pathway Issues Visualizer</h1>
        <select id="station-select">
            <option value="">-- Select a station --</option>
        </select>
        <span id="station-info" style="font-size: 13px; opacity: 0.8;"></span>
    </div>
    <div id="main">
        <div id="issues-panel">
            <h2>Issues</h2>
            <div id="issues-list"><p class="no-issues">Select a station to view issues.</p></div>
        </div>
        <div id="map-container">
            <div id="map"></div>
            <div class="custom-legend" id="legend">
                <strong>Location Types</strong>
                <div class="legend-item"><div class="legend-color" style="background:#3498db"></div> Platform</div>
                <div class="legend-item"><div class="legend-color" style="background:#2ecc71"></div> Entrance/Exit</div>
                <div class="legend-item"><div class="legend-color" style="background:#e67e22"></div> Node</div>
                <div class="legend-item"><div class="legend-color" style="background:#e74c3c"></div> Boarding Area</div>
                <div class="legend-item"><div class="legend-color" style="background:#9b59b6"></div> Exit</div>
                <hr style="margin:6px 0">
                <strong>Pathway Modes</strong>
                <div class="legend-item">—— Walkway / Fare Gate</div>
                <div class="legend-item" style="color:#8e44ad">⬡ Elevator</div>
                <div class="legend-item" style="text-decoration-style:dashed">- - Stairs / Escalator</div>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const STYLE_URL = 'https://tiles.mobidata-bw.de/styles/railway/style.json';
        const LOCATION_TYPE_COLORS = {
            '0': '#3498db', // platform — blue
            '1': '#95a5a6', // station — grey
            '2': '#2ecc71', // entrance — green
            '3': '#e67e22', // node/generic — orange
            '4': '#e74c3c', // boarding area — red
            '5': '#9b59b6'  // exit — purple
        };
        const LOCATION_TYPE_LABELS = {
            '0': 'Platform',
            '1': 'Station',
            '2': 'Entrance/Exit',
            '3': 'Node',
            '4': 'Boarding Area',
            '5': 'Exit'
        };
        const PATHWAY_MODE_LABELS = {
            '1': 'Walkway',
            '2': 'Stairs',
            '3': 'Moving Walkway',
            '4': 'Escalator',
            '5': 'Elevator',
            '6': 'Fare Gate',
            '7': 'Exit Gate'
        };

        let currentStation = null;
        let allStations = [];
        let map;
        let markersById = {};
        let edgesData = [];
        let stopEdgesMap = {}; // stopId → [edge_id, ...]
        let activeIssue = null;
        let activeStopId = null;
        let preventMapClick = false;
        let hoverPopup = null;

        // Base filters for edge layers (used to restore after stop filtering)
        const BASE_EDGE_FILTERS = {
            'edges-regular': ['!', ['in', ['get', 'mode'], ['literal', ['2', '4', '5']]]],
            'edges-stairs': ['in', ['get', 'mode'], ['literal', ['2', '4']]],
            'edges-elevator': ['==', ['get', 'mode'], '5']
        };

        // --- Load data ---
        async function loadData() {
            try {
                const response = await fetch('stations_and_issues.json');
                allStations = await response.json();
                populateDropdown();
            } catch (err) {
                document.body.insertAdjacentHTML('afterbegin',
                    `<div class="error-banner">Failed to load stations_and_issues.json: ${err.message}. Make sure the file is in the same directory.</div>`);
            }
        }

        function populateDropdown() {
            const select = document.getElementById('station-select');
            allStations.forEach(station => {
                const opt = document.createElement('option');
                opt.value = station.station_id;
                opt.textContent = `${station.station_id} (${station.pathway_issues.length} issues)`;
                select.appendChild(opt);
            });
            select.addEventListener('change', onStationChange);
        }

        // --- Map initialization ---
        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: STYLE_URL,
                center: [7, 50],
                zoom: 6
            });

            map.addControl(new maplibregl.NavigationControl(), 'top-left');

            map.on('load', () => {
                // Add empty sources
                map.addSource('stops', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
                map.addSource('edges', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
                map.addSource('highlights', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

                // Stops layer — circle markers colored by location_type
                map.addLayer({
                    id: 'stops',
                    type: 'circle',
                    source: 'stops',
                    paint: {
                        'circle-radius': [
                            'match', ['get', 'location_type'],
                            '0', 8,
                            6
                        ],
                        'circle-color': ['get', 'color'],
                        'circle-stroke-color': '#2c3e50',
                        'circle-stroke-width': 2,
                        'circle-stroke-opacity': 1,
                        'circle-opacity': 0.85
                    }
                });

                // Regular pathways (solid, dark, thin)
                map.addLayer({
                    id: 'edges-regular',
                    type: 'line',
                    source: 'edges',
                    filter: ['!', ['in', ['get', 'mode'], ['literal', ['2', '4', '5']]]],
                    paint: {
                        'line-color': '#2c3e50',
                        'line-width': 2,
                        'line-opacity': 0.6
                    }
                });

                // Stairs/escalator (dashed, red, thick)
                map.addLayer({
                    id: 'edges-stairs',
                    type: 'line',
                    source: 'edges',
                    filter: ['in', ['get', 'mode'], ['literal', ['2', '4']]],
                    paint: {
                        'line-color': '#e74c3c',
                        'line-width': 5,
                        'line-opacity': 0.85,
                        'line-dasharray': [8, 4]
                    }
                });

                // Elevator (dashed, purple)
                map.addLayer({
                    id: 'edges-elevator',
                    type: 'line',
                    source: 'edges',
                    filter: ['==', ['get', 'mode'], '5'],
                    paint: {
                        'line-color': '#8e44ad',
                        'line-width': 3,
                        'line-opacity': 0.85,
                        'line-dasharray': [2, 6]
                    }
                });

                // Highlights — stop rings
                map.addLayer({
                    id: 'highlights-stops',
                    type: 'circle',
                    source: 'highlights',
                    filter: ['==', ['get', 'type'], 'stop'],
                    paint: {
                        'circle-radius': ['get', 'radius'],
                        'circle-color': 'transparent',
                        'circle-stroke-color': '#e74c3c',
                        'circle-stroke-width': 3,
                        'circle-stroke-opacity': 0.9
                    }
                });

                // Highlights — pathway lines
                map.addLayer({
                    id: 'highlights-edges',
                    type: 'line',
                    source: 'highlights',
                    filter: ['==', ['get', 'type'], 'edge'],
                    paint: {
                        'line-color': '#e74c3c',
                        'line-width': 5,
                        'line-opacity': 0.9
                    }
                });

                // Hover popup (reused across all layers)
                hoverPopup = new maplibregl.Popup({
                    closeButton: false,
                    closeOnClick: false,
                    offset: [0, -10]
                });

                // --- Marker hover: show tooltip ---
                map.on('mouseenter', 'stops', (e) => {
                    map.getCanvas().style.cursor = 'pointer';
                    const props = e.features[0].properties;
                    let html = `<b>${props.stop_id}</b><br>${props.stop_name}<br>${props.location_type_label}`;
                    if (props.platform_code) html += ` · Code: ${props.platform_code}`;
                    hoverPopup.setLngLat(e.lngLat).setHTML(html).addTo(map);
                });
                map.on('mouseleave', 'stops', () => {
                    map.getCanvas().style.cursor = '';
                    hoverPopup.remove();
                });

                // --- Marker click: select / deselect stop, filter edges ---
                map.on('click', 'stops', (e) => {
                    preventMapClick = true;
                    const props = e.features[0].properties;
                    if (activeStopId === props.stop_id) {
                        // Deselect
                        activeStopId = null;
                        showAllEdges();
                    } else {
                        activeStopId = props.stop_id;
                        filterEdgesToStop(props.stop_id);
                        // Zoom to this marker
                        map.easeTo({ center: e.lngLat, zoom: 17 });
                    }
                });

                // --- Edge hover: show tooltip ---
                const edgeLayers = ['edges-regular', 'edges-stairs', 'edges-elevator'];
                edgeLayers.forEach(layerId => {
                    map.on('mouseenter', layerId, (e) => {
                        map.getCanvas().style.cursor = 'pointer';
                        const props = e.features[0].properties;
                        let html = `<b>${props.edge_id}</b><br>${props.mode_label}`;
                        if (props.length) html += `<br>Length: ${props.length}m`;
                        if (props.traversal_time) html += `<br>Time: ${props.traversal_time}s`;
                        if (props.signposted_as) html += `<br>→ ${props.signposted_as}`;
                        hoverPopup.setLngLat(e.lngLat).setHTML(html).addTo(map);
                    });
                    map.on('mouseleave', layerId, () => {
                        map.getCanvas().style.cursor = '';
                        hoverPopup.remove();
                    });
                });

                // If a station was already selected when the map finished loading, render it
                if (currentStation) {
                    renderStation();
                }
            });

            // Map click outside any marker → deselect stop/issue, show all edges
            map.on('click', () => {
                if (preventMapClick) {
                    preventMapClick = false;
                    return;
                }
                if (activeStopId !== null || activeIssue !== null) {
                    activeStopId = null;
                    activeIssue = null;
                    document.querySelectorAll('.issue-card').forEach(c => c.classList.remove('active'));
                    showAllEdges();
                }
            });
        }

        // --- Station change ---
        function onStationChange() {
            const stationId = document.getElementById('station-select').value;
            if (!stationId) {
                clearAll();
                return;
            }
            currentStation = allStations.find(s => s.station_id === stationId);
            if (map && map.isStyleLoaded()) {
                renderStation();
            }
        }

        function clearAll() {
            markersById = {};
            edgesData = [];
            stopEdgesMap = {};
            activeIssue = null;
            activeStopId = null;
            document.getElementById('issues-list').innerHTML = '<p class="no-issues">Select a station to view issues.</p>';
            document.getElementById('station-info').textContent = '';

            // Clear highlight source
            if (map && map.getSource('highlights')) {
                map.getSource('highlights').setData({ type: 'FeatureCollection', features: [] });
            }
        }

        function renderStation() {
            if (!currentStation || !map || !map.isStyleLoaded()) return;

            // Clear previous
            markersById = {};
            edgesData = [];
            stopEdgesMap = {};
            activeIssue = null;
            activeStopId = null;
            if (map.getSource('highlights')) {
                map.getSource('highlights').setData({ type: 'FeatureCollection', features: [] });
            }

            // Info
            const foreignCount = currentStation.foreign_stops ? currentStation.foreign_stops.length : 0;
            const info = document.getElementById('station-info');
            info.textContent = `${currentStation.children.length} stops · ${currentStation.edges.length} pathways` +
                (foreignCount > 0 ? ` · ${foreignCount} foreign stops` : '');

            // Draw child stops as GeoJSON
            drawChildren();

            // Draw edges as GeoJSON
            drawEdges();

            // Fit bounds to include foreign stops
            const allStops = [...currentStation.children];
            if (currentStation.foreign_stops) allStops.push(...currentStation.foreign_stops);
            const lats = allStops.map(c => parseFloat(c.stop_lat)).filter(v => !isNaN(v));
            const lngs = allStops.map(c => parseFloat(c.stop_lon)).filter(v => !isNaN(v));
            if (lats.length > 0 && lngs.length > 0) {
                map.fitBounds(
                    [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
                    { padding: 30, maxZoom: 17 }
                );
            }

            // Render issues
            renderIssues();
        }

        function drawChildren() {
            const features = [];

            currentStation.children.forEach(child => {
                const lat = parseFloat(child.stop_lat);
                const lon = parseFloat(child.stop_lon);
                if (isNaN(lat) || isNaN(lon)) return;

                const color = LOCATION_TYPE_COLORS[child.location_type] || '#7f8c8d';
                const label = LOCATION_TYPE_LABELS[child.location_type] || `Type ${child.location_type}`;

                features.push({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: [lon, lat] },
                    properties: {
                        stop_id: child.stop_id,
                        stop_name: child.stop_name,
                        location_type: child.location_type,
                        location_type_label: label,
                        platform_code: child.platform_code || '',
                        color: color
                    }
                });

                // Store for edge drawing and other lookups
                markersById[child.stop_id] = { lat, lon, stop: child };
            });

            // Draw foreign stops (stops from other stations involved in PathwayIncompatibleAncestor issues)
            if (currentStation.foreign_stops) {
                currentStation.foreign_stops.forEach(stop => {
                    const lat = parseFloat(stop.stop_lat);
                    const lon = parseFloat(stop.stop_lon);
                    if (isNaN(lat) || isNaN(lon)) return;

                    const color = LOCATION_TYPE_COLORS[stop.location_type] || '#7f8c8d';
                    const label = (LOCATION_TYPE_LABELS[stop.location_type] || `Type ${stop.location_type}`) + ' (other station)';

                    features.push({
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: [lon, lat] },
                        properties: {
                            stop_id: stop.stop_id,
                            stop_name: stop.stop_name,
                            location_type: stop.location_type,
                            location_type_label: label,
                            platform_code: stop.platform_code || '',
                            color: color,
                            is_foreign: true
                        }
                    });

                    // Store for edge drawing
                    markersById[stop.stop_id] = { lat, lon, stop };
                });
            }

            map.getSource('stops').setData({ type: 'FeatureCollection', features });
        }

        function drawEdges() {
            const features = [];
            edgesData = [];
            stopEdgesMap = {};

            currentStation.edges.forEach(edge => {
                const from = markersById[edge.from_stop_id];
                const to = markersById[edge.to_stop_id];
                if (!from || !to) return;

                edgesData.push({ edge_id: edge.id, from_stop_id: edge.from_stop_id, to_stop_id: edge.to_stop_id });

                // Build reverse map: stop → connected edge IDs
                if (!stopEdgesMap[edge.from_stop_id]) stopEdgesMap[edge.from_stop_id] = [];
                stopEdgesMap[edge.from_stop_id].push(edge.id);
                if (!stopEdgesMap[edge.to_stop_id]) stopEdgesMap[edge.to_stop_id] = [];
                stopEdgesMap[edge.to_stop_id].push(edge.id);

                features.push({
                    type: 'Feature',
                    geometry: {
                        type: 'LineString',
                        coordinates: [[from.lon, from.lat], [to.lon, to.lat]]
                    },
                    properties: {
                        edge_id: edge.id,
                        mode: edge.mode,
                        mode_label: PATHWAY_MODE_LABELS[edge.mode] || `Mode ${edge.mode}`,
                        length: edge.length || '',
                        traversal_time: edge.traversal_time || '',
                        signposted_as: edge.signposted_as || ''
                    }
                });
            });

            map.getSource('edges').setData({ type: 'FeatureCollection', features });
            showAllEdges(); // Reset filters to defaults
        }

        function renderIssues() {
            const container = document.getElementById('issues-list');
            if (!currentStation.pathway_issues || currentStation.pathway_issues.length === 0) {
                container.innerHTML = '<p class="no-issues">✅ No issues for this station.</p>';
                return;
            }

            container.innerHTML = currentStation.pathway_issues.map((issue, idx) => {
                const pathwayStr = issue.pathway_id
                    ? `<div class="issue-pathway">Pathway: <code>${issue.pathway_id}</code></div>`
                    : '';
                const stopsStr = issue.involved_stop_ids && issue.involved_stop_ids.length > 0
                    ? `<div class="issue-stops">Stops: ${issue.involved_stop_ids.map(id => `<span>${id}</span>`).join(' ')}</div>`
                    : '';
                return `<div class="issue-card" data-index="${idx}" onclick="onIssueClick(${idx})">
                    <div class="issue-type">⚠️ ${issue.issue_type}</div>
                    ${pathwayStr}${stopsStr}
                </div>`;
            }).join('');
        }

        function onIssueClick(index) {
            const issue = currentStation.pathway_issues[index];
            if (!issue) return;

            // Toggle active state
            document.querySelectorAll('.issue-card').forEach(c => c.classList.remove('active'));
            const card = document.querySelector(`.issue-card[data-index="${index}"]`);
            if (card) card.classList.add('active');

            const stopIdsToHighlight = new Set(issue.involved_stop_ids || []);
            const pathwayIdToHighlight = issue.pathway_id;

            // If we previously had this issue active, just deselect
            if (activeIssue && activeIssue.index === index && activeIssue.stationId === currentStation.station_id) {
                activeIssue = null;
                document.querySelectorAll('.issue-card').forEach(c => c.classList.remove('active'));
                map.getSource('highlights').setData({ type: 'FeatureCollection', features: [] });
                showAllEdges();
                return;
            }
            activeIssue = { index, stationId: currentStation.station_id };

            // For PathwayIncompatibleAncestor issues: hide all pathways except the problem one
            if (issue.issue_type === 'PathwayIncompatibleAncestor' && pathwayIdToHighlight) {
                const filterExpr = ['==', ['get', 'edge_id'], pathwayIdToHighlight];
                Object.entries(BASE_EDGE_FILTERS).forEach(([layerId, baseFilter]) => {
                    map.setFilter(layerId, ['all', baseFilter, filterExpr]);
                });
            } else {
                showAllEdges();
            }

            const highlightFeatures = [];

            // Highlight involved stops
            stopIdsToHighlight.forEach(stopId => {
                const entry = markersById[stopId];
                if (!entry) return;
                highlightFeatures.push({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: [entry.lon, entry.lat] },
                    properties: {
                        type: 'stop',
                        radius: entry.stop.location_type === '0' ? 14 : 11,
                        stop_id: stopId
                    }
                });
            });

            // Highlight relevant pathway
            if (pathwayIdToHighlight) {
                const edgeData = edgesData.find(e => e.edge_id === pathwayIdToHighlight);
                if (edgeData) {
                    const from = markersById[edgeData.from_stop_id];
                    const to = markersById[edgeData.to_stop_id];
                    if (from && to) {
                        highlightFeatures.push({
                            type: 'Feature',
                            geometry: { type: 'LineString', coordinates: [[from.lon, from.lat], [to.lon, to.lat]] },
                            properties: { type: 'edge' }
                        });
                    }
                }
            }

            map.getSource('highlights').setData({ type: 'FeatureCollection', features: highlightFeatures });

            // Zoom to the involved stops
            const involvedCoords = [];
            stopIdsToHighlight.forEach(stopId => {
                const entry = markersById[stopId];
                if (entry) involvedCoords.push([entry.lon, entry.lat]);
            });
            if (involvedCoords.length > 0) {
                const lngs = involvedCoords.map(c => c[0]);
                const lats = involvedCoords.map(c => c[1]);
                map.fitBounds(
                    [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
                    { padding: 80, maxZoom: 17 }
                );
            }
        }

        // --- Pathway filtering by stop ---
        function filterEdgesToStop(stopId) {
            const connectedIds = stopEdgesMap[stopId] || [];
            if (connectedIds.length === 0) return;

            const filterExpr = ['in', ['get', 'edge_id'], ['literal', [...new Set(connectedIds)]]];

            // Append the stop-filter to each layer's base filter
            Object.entries(BASE_EDGE_FILTERS).forEach(([layerId, baseFilter]) => {
                map.setFilter(layerId, ['all', baseFilter, filterExpr]);
            });
        }

        function showAllEdges() {
            // Restore base filters (no stop filtering)
            Object.entries(BASE_EDGE_FILTERS).forEach(([layerId, baseFilter]) => {
                map.setFilter(layerId, baseFilter);
            });
        }

        // --- Startup ---
        initMap();
        loadData();
    </script>
</body>
</html>
