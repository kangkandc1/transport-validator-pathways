<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Pathway Issues Visualizer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
        #header { background: #2c3e50; color: white; padding: 10px 20px; display: flex; align-items: center; gap: 15px; flex-shrink: 0; }
        #header h1 { font-size: 18px; white-space: nowrap; }
        #station-select { padding: 6px 10px; font-size: 14px; border-radius: 4px; border: none; min-width: 250px; }
        #main { display: flex; flex: 1; overflow: hidden; }
        #issues-panel { width: 350px; flex-shrink: 0; background: #f5f6fa; border-right: 1px solid #dcdde1; display: flex; flex-direction: column; overflow: hidden; }
        #issues-panel h2 { padding: 15px; font-size: 16px; background: #ecf0f1; border-bottom: 1px solid #dcdde1; }
        #issues-list { flex: 1; overflow-y: auto; padding: 10px; }
        .issue-card { background: white; border: 1px solid #dcdde1; border-radius: 6px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
        .issue-card:hover { border-color: #3498db; box-shadow: 0 2px 8px rgba(52,152,219,0.15); }
        .issue-card.active { border-color: #e74c3c; background: #fdf0ef; box-shadow: 0 0 0 2px rgba(231,76,60,0.3); }
        .issue-type { font-weight: 700; font-size: 14px; margin-bottom: 6px; color: #2c3e50; }
        .issue-pathway { font-size: 12px; color: #7f8c8d; margin-bottom: 4px; }
        .issue-stops { font-size: 12px; color: #7f8c8d; }
        .issue-stops span { display: inline-block; background: #ecf0f1; padding: 2px 6px; border-radius: 3px; margin: 1px; font-family: monospace; font-size: 11px; }
        .no-issues { color: #95a5a6; text-align: center; padding: 20px; font-style: italic; }
        #map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        .legend { background: white; padding: 10px; border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,0.2); }
        .legend-item { display: flex; align-items: center; gap: 6px; margin: 4px 0; font-size: 12px; }
        .legend-color { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #333; }
        .error-banner { background: #e74c3c; color: white; padding: 12px 20px; text-align: center; flex-shrink: 0; }
    </style>
</head>
<body>
    <div id="header">
        <h1>🚇 Pathway Issues Visualizer</h1>
        <select id="station-select">
            <option value="">-- Select a station --</option>
        </select>
        <span id="station-info" style="font-size: 13px; opacity: 0.8;"></span>
    </div>
    <div id="main">
        <div id="issues-panel">
            <h2>Issues</h2>
            <div id="issues-list"><p class="no-issues">Select a station to view issues.</p></div>
        </div>
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- Configuration ---
        const LOCATION_TYPE_COLORS = {
            '0': '#3498db', // platform — blue
            '1': '#95a5a6', // station — grey (unlikely as child)
            '2': '#2ecc71', // entrance — green
            '3': '#e67e22', // node/generic — orange
            '4': '#e74c3c', // boarding area — red
            '5': '#9b59b6'  // exit — purple
        };
        const LOCATION_TYPE_LABELS = {
            '0': 'Platform',
            '1': 'Station',
            '2': 'Entrance/Exit',
            '3': 'Node',
            '4': 'Boarding Area',
            '5': 'Exit'
        };
        const PATHWAY_MODE_LABELS = {
            '1': 'Walkway',
            '2': 'Stairs',
            '3': 'Moving Walkway',
            '4': 'Escalator',
            '5': 'Elevator',
            '6': 'Fare Gate',
            '7': 'Exit Gate'
        };
        const PATHWAY_MODE_DASH = {
            '2': '8,4',
            '4': '4,6',
            '5': '2,6'
        };
        const PATHWAY_MODE_COLOR = {
            '2': '#e74c3c', // stairs — thick red
            '4': '#e74c3c', // escalator — thick red
            '5': '#8e44ad'  // elevator gets a distinct color
        };

        let currentStation = null;
        let allStations = [];
        let map, markersGroup, edgesGroup, highlightGroup;
        let markersById = {};
        let edgesById = {};
        let stopEdgesMap = {}; // stopId → [edge entries from edgesById]
        let activeIssue = null;
        let activeStopId = null; // currently "selected" stop for pathway filtering

        // --- Load data ---
        async function loadData() {
            try {
                const response = await fetch('stations_and_issues.json');
                allStations = await response.json();
                populateDropdown();
            } catch (err) {
                document.body.insertAdjacentHTML('afterbegin',
                    `<div class="error-banner">Failed to load stations_and_issues.json: ${err.message}. Make sure the file is in the same directory.</div>`);
            }
        }

        function populateDropdown() {
            const select = document.getElementById('station-select');
            allStations.forEach(station => {
                const opt = document.createElement('option');
                opt.value = station.station_id;
                opt.textContent = `${station.station_id} (${station.pathway_issues.length} issues)`;
                select.appendChild(opt);
            });
            select.addEventListener('change', onStationChange);
        }

        // --- Map initialization ---
        function initMap() {
            map = L.map('map').setView([50, 7], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 18
            }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);
            edgesGroup = L.layerGroup().addTo(map);
            highlightGroup = L.layerGroup().addTo(map);

            addLegend();

            // Map click outside any marker → show all edges again
            map.on('click', () => {
                if (activeStopId !== null) {
                    activeStopId = null;
                    showAllEdges();
                }
            });
        }

        function addLegend() {
            const legend = L.control({ position: 'bottomright' });
            legend.onAdd = function () {
                const div = L.DomUtil.create('div', 'legend');
                div.innerHTML = '<strong>Location Types</strong>';
                for (const [type, color] of Object.entries(LOCATION_TYPE_COLORS)) {
                    div.innerHTML += `<div class="legend-item">
                        <div class="legend-color" style="background:${color}"></div>
                        ${LOCATION_TYPE_LABELS[type] || type}
                    </div>`;
                }
                div.innerHTML += '<hr style="margin:6px 0"><strong>Pathway Modes</strong>';
                div.innerHTML += `<div class="legend-item">—— Walkway / Fare Gate</div>`;
                div.innerHTML += `<div class="legend-item" style="color:#8e44ad">⬡ Elevator</div>`;
                div.innerHTML += `<div class="legend-item" style="text-decoration-style:dashed">- - Stairs / Escalator</div>`;
                return div;
            };
            legend.addTo(map);
        }

        // --- Station change ---
        function onStationChange() {
            const stationId = document.getElementById('station-select').value;
            if (!stationId) {
                clearAll();
                return;
            }
            currentStation = allStations.find(s => s.station_id === stationId);
            renderStation();
        }

        function clearAll() {
            markersGroup.clearLayers();
            edgesGroup.clearLayers();
            highlightGroup.clearLayers();
            markersById = {};
            edgesById = {};
            stopEdgesMap = {};
            activeIssue = null;
            activeStopId = null;
            document.getElementById('issues-list').innerHTML = '<p class="no-issues">Select a station to view issues.</p>';
            document.getElementById('station-info').textContent = '';
        }

        function renderStation() {
            if (!currentStation) return;

            // Clear previous
            markersGroup.clearLayers();
            edgesGroup.clearLayers();
            highlightGroup.clearLayers();
            markersById = {};
            edgesById = {};
            stopEdgesMap = {};
            activeIssue = null;
            activeStopId = null;

            // Info
            const info = document.getElementById('station-info');
            info.textContent = `${currentStation.children.length} stops · ${currentStation.edges.length} pathways`;

            // Draw child stops first (so we know their coordinates for edges)
            drawChildren();

            // Draw edges as LINESTRINGs between stops
            drawEdges();

            // Fit bounds
            if (currentStation.children.length > 0) {
                const lats = currentStation.children.map(c => parseFloat(c.stop_lat)).filter(v => !isNaN(v));
                const lngs = currentStation.children.map(c => parseFloat(c.stop_lon)).filter(v => !isNaN(v));
                if (lats.length > 0 && lngs.length > 0) {
                    const bounds = L.latLngBounds(
                        [Math.min(...lats), Math.min(...lngs)],
                        [Math.max(...lats), Math.max(...lngs)]
                    );
                    map.fitBounds(bounds.pad(0.2), { maxZoom: 17 });
                }
            }

            // Render issues
            renderIssues();
        }

        function drawChildren() {
            currentStation.children.forEach(child => {
                const lat = parseFloat(child.stop_lat);
                const lon = parseFloat(child.stop_lon);
                if (isNaN(lat) || isNaN(lon)) return;

                const color = LOCATION_TYPE_COLORS[child.location_type] || '#7f8c8d';
                const label = LOCATION_TYPE_LABELS[child.location_type] || `Type ${child.location_type}`;

                const marker = L.circleMarker([lat, lon], {
                    radius: child.location_type === '0' ? 8 : 6,
                    fillColor: color,
                    color: '#2c3e50',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.85
                }).addTo(markersGroup);

                marker.bindTooltip(`<b>${child.stop_id}</b><br>${child.stop_name}<br>${label}${child.platform_code ? ' · Code: ' + child.platform_code : ''}`, {
                    direction: 'top',
                    offset: [0, -8]
                });

                marker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    if (activeStopId === child.stop_id) {
                        // Deselect — show all edges
                        activeStopId = null;
                        showAllEdges();
                    } else {
                        // Select — show only edges connected to this stop
                        activeStopId = child.stop_id;
                        filterEdgesToStop(child.stop_id);
                    }
                    // Zoom to this marker
                    map.setView([lat, lon], 17);
                });

                markersById[child.stop_id] = { marker, lat, lon, stop: child };
            });
        }

        function drawEdges() {
            currentStation.edges.forEach(edge => {
                const from = markersById[edge.from_stop_id];
                const to = markersById[edge.to_stop_id];
                if (!from || !to) return;

                const isStairsOrEscalator = edge.mode === '2' || edge.mode === '4';
                const modeColor = PATHWAY_MODE_COLOR[edge.mode] || (isStairsOrEscalator ? '#e74c3c' : '#2c3e50');
                const dashArray = PATHWAY_MODE_DASH[edge.mode] || null;
                const modeLabel = PATHWAY_MODE_LABELS[edge.mode] || `Mode ${edge.mode}`;
                const weight = isStairsOrEscalator ? 5 : (edge.mode === '5' ? 3 : 2);
                const opacity = isStairsOrEscalator ? 0.85 : 0.6;

                // Draw pathway as a LINESTRING (two-point polyline) between stops
                const linestring = [[from.lat, from.lon], [to.lat, to.lon]];
                const line = L.polyline(linestring, {
                    color: modeColor,
                    weight: weight,
                    opacity: opacity,
                    dashArray: dashArray,
                    edgeId: edge.id
                }).addTo(edgesGroup);

                // Bind tooltip with edge info
                let tooltipText = `<b>${edge.id}</b><br>${modeLabel}`;
                if (edge.length) tooltipText += `<br>Length: ${edge.length}m`;
                if (edge.traversal_time) tooltipText += `<br>Time: ${edge.traversal_time}s`;
                if (edge.signposted_as) tooltipText += `<br>→ ${edge.signposted_as}`;
                line.bindTooltip(tooltipText, { sticky: true });

                // Store for highlighting
                if (!edgesById[edge.id]) edgesById[edge.id] = [];
                const edgeEntry = { line, fromId: edge.from_stop_id, toId: edge.to_stop_id };
                edgesById[edge.id].push(edgeEntry);

                // Build reverse map: stop → connected edges
                if (!stopEdgesMap[edge.from_stop_id]) stopEdgesMap[edge.from_stop_id] = [];
                stopEdgesMap[edge.from_stop_id].push(edgeEntry);
                if (!stopEdgesMap[edge.to_stop_id]) stopEdgesMap[edge.to_stop_id] = [];
                stopEdgesMap[edge.to_stop_id].push(edgeEntry);
            });
        }

        function renderIssues() {
            const container = document.getElementById('issues-list');
            if (!currentStation.pathway_issues || currentStation.pathway_issues.length === 0) {
                container.innerHTML = '<p class="no-issues">✅ No issues for this station.</p>';
                return;
            }

            container.innerHTML = currentStation.pathway_issues.map((issue, idx) => {
                const pathwayStr = issue.pathway_id
                    ? `<div class="issue-pathway">Pathway: <code>${issue.pathway_id}</code></div>`
                    : '';
                const stopsStr = issue.involved_stop_ids && issue.involved_stop_ids.length > 0
                    ? `<div class="issue-stops">Stops: ${issue.involved_stop_ids.map(id => `<span>${id}</span>`).join(' ')}</div>`
                    : '';
                return `<div class="issue-card" data-index="${idx}" onclick="onIssueClick(${idx})">
                    <div class="issue-type">⚠️ ${issue.issue_type}</div>
                    ${pathwayStr}${stopsStr}
                </div>`;
            }).join('');
        }

        function onIssueClick(index) {
            const issue = currentStation.pathway_issues[index];
            if (!issue) return;

            // Toggle active state
            document.querySelectorAll('.issue-card').forEach(c => c.classList.remove('active'));
            const card = document.querySelector(`.issue-card[data-index="${index}"]`);
            if (card) card.classList.add('active');

            // Clear previous highlights
            highlightGroup.clearLayers();

            const stopIdsToHighlight = new Set(issue.involved_stop_ids || []);
            const pathwayIdToHighlight = issue.pathway_id;

            // If we previously had this issue active, just deselect
            if (activeIssue && activeIssue.index === index && activeIssue.stationId === currentStation.station_id) {
                activeIssue = null;
                document.querySelectorAll('.issue-card').forEach(c => c.classList.remove('active'));
                return;
            }
            activeIssue = { index, stationId: currentStation.station_id };

            // Highlight involved stops with pulsing rings
            stopIdsToHighlight.forEach(stopId => {
                const entry = markersById[stopId];
                if (!entry) return;
                const ring = L.circleMarker([entry.lat, entry.lon], {
                    radius: entry.stop.location_type === '0' ? 14 : 11,
                    fillColor: 'transparent',
                    color: '#e74c3c',
                    weight: 3,
                    opacity: 0.9,
                    dashArray: '4,2'
                }).addTo(highlightGroup);
                ring.bindTooltip(`<b>${stopId}</b><br>Involved in this issue`, { direction: 'top' });
            });

            // Highlight relevant pathway
            if (pathwayIdToHighlight && edgesById[pathwayIdToHighlight]) {
                edgesById[pathwayIdToHighlight].forEach(edge => {
                    const fromEntry = markersById[edge.fromId];
                    const toEntry = markersById[edge.toId];
                    if (fromEntry && toEntry) {
                        const hl = L.polyline([[fromEntry.lat, fromEntry.lon], [toEntry.lat, toEntry.lon]], {
                            color: '#e74c3c',
                            weight: 5,
                            opacity: 0.9
                        }).addTo(highlightGroup);
                    }
                });
            }
        }

        // --- Pathway filtering by stop ---
        function filterEdgesToStop(stopId) {
            const connectedEdges = stopEdgesMap[stopId] || [];
            const connectedEdgeIds = new Set(connectedEdges.map(e => e.line.options.edgeId));

            // Hide all edges…
            edgesGroup.eachLayer(layer => {
                if (layer instanceof L.Polyline) {
                    layer.setStyle({ opacity: 0, fillOpacity: 0 });
                }
            });

            // …then show only the connected ones
            connectedEdges.forEach(edgeEntry => {
                edgeEntry.line.setStyle({
                    opacity: 0.85,
                    fillOpacity: 0.85
                });
            });
        }

        function showAllEdges() {
            edgesGroup.eachLayer(layer => {
                if (layer instanceof L.Polyline) {
                    const edgeId = layer.options.edgeId;
                    // Re-apply original styling
                    const originalEdge = currentStation.edges.find(e => e.id === edgeId);
                    if (originalEdge) {
                        const isStairsOrEsc = originalEdge.mode === '2' || originalEdge.mode === '4';
                        layer.setStyle({
                            opacity: isStairsOrEsc ? 0.85 : 0.6,
                            fillOpacity: isStairsOrEsc ? 0.85 : 0.6
                        });
                    } else {
                        layer.setStyle({ opacity: 0.6, fillOpacity: 0.6 });
                    }
                }
            });
        }

        // --- Startup ---
        initMap();
        loadData();
    </script>
</body>
</html>
